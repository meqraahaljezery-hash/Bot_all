# ==============================================================================
# Docker Compose for Imam Al-Jazari Telegram Bot & Infrastructure
# ==============================================================================
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jazari_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MODE=${BOT_MODE:-polling}
      - WEBHOOK_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/jazari_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: jazari_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jazari_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bot/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./bot/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jazari_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
