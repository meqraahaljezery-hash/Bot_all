name: CI / Build & Test Suite

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Python Test Suite (26 Scenarios)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Pytest & Unittest
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          pytest -v tests/test_bot_suite.py --junitxml=test-results.xml

      - name: Verify Secret Leak Prevention
        run: |
          ! grep -rn "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" bot/ tests/
          echo "Secret scan passed cleanly."

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  build-docker:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: imam-al-jazari-bot:latest
